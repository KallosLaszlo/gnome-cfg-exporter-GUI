name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            webkit: libwebkit2gtk-4.0-dev
            label: webkit2gtk-4.0
            suffix: "-webkit2gtk-4.0"
            build-tags: ""
          - runner: ubuntu-24.04
            webkit: libwebkit2gtk-4.1-dev
            label: webkit2gtk-4.1
            suffix: "-webkit2gtk-4.1"
            build-tags: "-tags webkit2_41"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ${{ matrix.webkit }}

      - name: Build
        run: |
          wails build -clean ${{ matrix.build-tags }}
          mv build/bin/gnome-cfg-exporter build/bin/gnome-cfg-exporter${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-cfg-exporter${{ matrix.suffix }}
          path: build/bin/gnome-cfg-exporter${{ matrix.suffix }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 📦 Which binary should I download?

            > **Not sure?** Run this in a terminal:
            > ```
            > pkg-config --modversion webkit2gtk-4.1 2>/dev/null && echo "→ Download the 4.1 build" || echo "→ Download the 4.0 build"
            > ```

            | Binary | For | Distros |
            |--------|-----|---------|
            | **gnome-cfg-exporter-webkit2gtk-4.1** | 🟢 Modern distros (2024+) | Ubuntu 24.04+, Fedora 40+, Arch, Manjaro, openSUSE TW, Debian 13+ |
            | **gnome-cfg-exporter-webkit2gtk-4.0** | 🟡 Older distros | Ubuntu 20.04–22.04, Mint 20–21, Fedora 36–39, Debian 11–12 |
          files: |
            artifacts/gnome-cfg-exporter-webkit2gtk-4.0
            artifacts/gnome-cfg-exporter-webkit2gtk-4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
